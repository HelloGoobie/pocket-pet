<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Pets</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:13px/1.35 "Segoe UI",Verdana,sans-serif;color:#2a2233;user-select:none;pointer-events:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%}
#hit{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:auto;cursor:pointer;border-radius:50%}
#panel{position:absolute;width:250px;display:none;pointer-events:auto;background:#fff8ee;border:2px solid #2a2233;border-radius:14px;padding:10px 12px;box-shadow:0 6px 0 #2a2233,0 10px 24px rgba(0,0,0,.4)}
#panel h3{margin:0 0 6px;padding-right:70px;font-size:15px;display:flex;gap:6px;align-items:center}
#panel h3 input{flex:1;min-width:0;border:2px solid #2a2233;border-radius:8px;padding:3px 6px;font:inherit;font-weight:700;background:#fff;color:#2a2233;user-select:text}
.sp{display:flex;gap:5px;margin:6px 0}
.sp button{flex:1;font-size:20px;padding:3px 0;border:2px solid #2a2233;border-radius:9px;background:#fff;cursor:pointer}
.sp button.on{background:#ffd76a}
.bar{height:12px;background:#e6dccb;border:2px solid #2a2233;border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:#59d36f}
.small{font-size:11px;color:#6b5f78;margin-top:5px}
.row{display:flex;align-items:center;gap:6px;margin-top:6px}.row label{width:54px;font-size:11px}.row input[type=range]{flex:1}
.b{border:2px solid #2a2233;border-radius:8px;background:#fff;padding:4px 8px;cursor:pointer;font:inherit}.b:hover{background:#ffe9a6}
.top{position:absolute;right:8px;top:6px;display:flex;gap:4px}
.sw{display:flex;gap:3px;flex-wrap:wrap;margin:3px 0}.swb{width:20px;height:20px;border:2px solid #2a2233;border-radius:6px;cursor:pointer;padding:0;font-size:10px;line-height:14px;background:#fff;color:#2a2233}.swb.on{box-shadow:0 0 0 2px #ffd76a}.swb.lock{opacity:.35;cursor:not-allowed}
details summary{cursor:pointer;margin-top:6px}.row input[type=text]{flex:1;min-width:0;border:2px solid #2a2233;border-radius:6px;padding:2px 5px;font:inherit;user-select:text}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hit"></div>
<div id="panel">
 <div class="top"><button class="b" id="pin" title="Keep on screen">📌</button><button class="b" id="close" title="Hide (F1)">✕</button></div>
 <h3><span id="ico"></span><input id="name" maxlength="14"></h3>
 <div class="sp" id="sp"></div>
 <div>Level <b id="lv">1</b> <span class="small" id="xpt"></span></div><div class="bar"><i id="xpb"></i></div>
 <div class="small" id="hunger_t"></div><div class="bar"><i id="hb" style="background:#ff8a4c"></i></div>
 <div class="small" id="stats"></div>
 <div class="small" id="learn"></div>
 <div class="small" style="margin-top:6px">Trail <span id="trn"></span></div><div class="sw" id="sw"></div>
 <div class="row"><button class="b" id="petit">💖 Pet</button><button class="b" id="stay">🚶 Roam</button><button class="b" id="hg">🍖 Hunger</button></div>
 <details><summary class="small">Settings</summary>
 <div class="row"><label>Money key</label><input type="text" id="mk" maxlength="30"></div>
 <div class="row"><button class="b" id="tdrop">🍖 Test drop</button><span class="small" id="mstat"></span></div>
 <div class="row"><label>Map zone</label><button class="b" id="zt">On</button><span class="small">pet climbs over it</span></div>
 <div class="row"><label>Left</label><input type="range" id="zl" min="0" max="100"></div>
 <div class="row"><label>Width</label><input type="range" id="zw" min="80" max="600"></div>
 <div class="row"><label>Height</label><input type="range" id="zh" min="40" max="400"></div>
 <div class="row"><label>Size</label><input type="range" id="zs" min="10" max="30"></div>
 </details>
</div>
<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i);},clamp=function(v,a,b){return Math.min(b,Math.max(a,v));};
function post(m){if(window.parent!==window)window.parent.postMessage(m,'*');}
var KEY='pocketpets_v1',num=function(v){v=Number(v);return isFinite(v)?v:null;};
var S={species:'dog',name:'Biscuit',xp:0,dist:0,zone:true,zl:0,zw:300,zh:200,roam:true,size:1.2,food:0,hunger:100,deaths:0,mkey:'money',trail:'auto',hungry:true};
try{var r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)for(var k in S)if(typeof r[k]===typeof S[k])S[k]=r[k];}catch(e){}
S.xp=Math.max(0,S.xp);if(!(S.size>=1&&S.size<=3))S.size=1.2;function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var SPEC={dog:['🐶','Biscuit'],cat:['🐱','Mochi'],panda:['🐼','Bamboo'],penguin:['🐧','Waddles'],frog:['🐸','Hopper']};

// ---- levels ----
var MAXL=50,need=function(l){return Math.floor(70*Math.pow(l,1.55));};
function lvl(xp){var l=1,t=0;while(l<MAXL&&xp>=t+need(l)){t+=need(l);l++;}return{l:l,into:xp-t,need:l<MAXL?need(l):1};}
var cur=lvl(S.xp).l;
// ---- audio ----
var ac=null;document.addEventListener('pointerdown',function(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.resume)ac.resume();});
function chime(n){if(!ac)return;var t=ac.currentTime;n.forEach(function(f,i){var o=ac.createOscillator(),e=ac.createGain();o.type='triangle';o.frequency.value=f;e.gain.setValueAtTime(.0001,t+i*.09);e.gain.exponentialRampToValueAtTime(.12,t+i*.09+.01);e.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.3);o.connect(e);e.connect(ac.destination);o.start(t+i*.09);o.stop(t+i*.09+.32);});}
// ---- xp ----
var parts=[],bubble=null;
function addXp(n){if(n<=0)return;S.xp+=n;var L=lvl(S.xp).l;if(L>cur){cur=L;burst(14);chime([523,659,784,1047]);bubble={t:Date.now(),txt:'LEVEL '+L+'!'};if(L===2)bubble.txt='LEVEL 2! I can climb the map now!';if(L===3)bubble.txt='LEVEL 3! I can climb walls!';if(L===4)bubble.txt='LEVEL 4! Ceiling walker!';jump=1;}}
function burst(n){for(var i=0;i<n;i++)parts.push({x:pet.x+(Math.random()-.5)*40,y:pet.y-50,vx:(Math.random()-.5)*60,vy:-40-Math.random()*60,life:1.4,c:Math.random()<.5?'❤':'✨'});}

// ---- game data ----
var P={x:null,y:null,h:0},last=null,speed=0,lastMove=Date.now(),mprev={},mseen={},seen={},probes={level:null,xp:null,exp:null,rank:null};
window.addEventListener('message',function(e){var d=e.data&&e.data.data;if(!d||typeof d!=='object')return;var v;
 Object.keys(d).forEach(function(k){seen[k]=1;});
 var mk=['money','cash','wallet'];if(S.mkey&&mk.indexOf(S.mkey)<0)mk.push(S.mkey);
 mk.forEach(function(k){if(k in d){var q=mv2(d[k]);if(q!==null){mseen[k]=1;if(mprev[k]!==undefined&&q>mprev[k])onEarn(q-mprev[k]);mprev[k]=q;}}});
 if('pos_x' in d&&(v=num(d.pos_x))!==null)P.x=v;if('pos_y' in d&&(v=num(d.pos_y))!==null)P.y=v;
 ['level','xp','exp','rank'].forEach(function(k){if(k in d&&(v=num(d[k]))!==null){if(probes[k]!==null&&v>probes[k]){addXp(k==='level'||k==='rank'?150*(v-probes[k]):Math.min(100,(v-probes[k])/10));}probes[k]=v;}});});
function mv2(v){if(typeof v==='number')return isFinite(v)?v:null;if(typeof v==='string'){var s=v.replace(/[^0-9.\-]/g,'');if(!s)return null;var n2=Number(s);return isFinite(n2)?n2:null;}return null;}
function ask(){post({type:'getNamedData',keys:['pos_x','pos_y','pos_h','health','armor','level','xp','exp','rank','money','cash','wallet',S.mkey]});}
var carry=0;
setInterval(function(){ask();if(P.x===null)return;if(last){var dx=P.x-last.x,dy=P.y-last.y,d=Math.sqrt(dx*dx+dy*dy);speed=d;if(d>.5&&d<250){S.dist+=d;carry+=d;lastMove=Date.now();if(carry>=20){addXp(Math.floor(carry/20));carry%=20;}}}last={x:P.x,y:P.y};},1000);
setInterval(function(){save();},5000);

// ---- track ----
var cv=$('cv'),g=cv.getContext('2d'),W=0,H=0,segs=[],pet={x:60,y:0,ang:0,face:1,i:0,u:0,d:1,phase:0,pose:'walk',sit:0,until:0,hop:0},jump=0,zone={x:0,y:0,w:0,h:0};
var lw=0,lh=0;
function build(){W=cv.width=innerWidth;H=cv.height=innerHeight;var pts,rq;
 if(S.zone){var zw=Math.min(S.zw,W-100),zh=Math.min(S.zh,H-60),zx=S.zl/100*(W-zw);zone={x:zx,y:H-zh,w:zw,h:zh};
  if(zx<1){pts=[[0,H-zh],[zw,H-zh],[zw,H],[W,H],[W,0],[0,0],[0,H-zh]];rq=[2,2,0,3,4,3];}else{pts=[[0,H],[zx,H],[zx,H-zh],[zx+zw,H-zh],[zx+zw,H],[W,H],[W,0],[0,0],[0,H]];rq=[0,2,2,2,0,3,4,3];}}
 else{zone={x:0,y:0,w:0,h:0};pts=[[0,H],[W,H],[W,0],[0,0],[0,H]];rq=[0,3,4,3];}
 segs=[];for(var i=0;i<pts.length-1;i++){var a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<1)continue;segs.push({a:a,b:b,len:L,req:rq[i],dx:(b[0]-a[0])/L,dy:(b[1]-a[1])/L});}
 tf=0;for(var z=0;z<segs.length;z++)if(segs[z].dy===0&&segs[z].dx>0&&segs[z].b[1]>=H-1&&segs[z].b[0]>=W-1)tf=z;
 if(W!==lw||H!==lh){lw=W;lh=H;initPile();}
 pet.i=Math.min(pet.i,segs.length-1);if(segs[pet.i].req>0){for(var q=0;q<segs.length;q++)if(segs[q].req===0){pet.i=q;break;}pet.u=0;}pet.u=Math.min(pet.u,segs[pet.i].len);}
addEventListener('resize',build);

// ---- food, hunger, trails ----
var COLS=6,CW=22,CAP=42,PIL=COLS*CW+14;
var FOODS={dog:['🍖','🍗','🦴','🥩'],cat:['🐟','🐠','🍤','🥛'],panda:['🎋','🍃','🌿','🎍'],penguin:['🐟','🦐','🐠','🦑'],frog:['🪰','🐛','🦟','🐞']};
var TCOL=['#c9c9d6','#7bd66b','#35c4a5','#4fc3f7','#6f8bff','#b07bff','#ff7bd5','#ff9f45'];
var pile=[],fall=[],lcnt=[0,0,0,0,0,0],dropQ=0,dropT=0,eatT=0,feeding=false,dead=null,starve=0,nextHungry=0,tf=0,trail=[],trAcc=0,trPos=0,lastTick=Date.now();
function foodE(){var a=FOODS[S.species];return a[Math.floor(Math.random()*a.length)];}
function colX(c){return W-14-CW/2-(COLS-1-c)*CW;}
function landY(c){return H-9-lcnt[c]*13;}
function pickCol(){var c=Math.floor(Math.random()*COLS),n=[],i;for(i=0;i<COLS;i++)n[i]=lcnt[i]+fall.filter(function(f){return f.col===i;}).length;
 for(var k=0;k<4;k++){var l=c>0?n[c-1]:99,r=c<COLS-1?n[c+1]:99;if(l<n[c]-1&&l<=r)c--;else if(r<n[c]-1)c++;else break;}return c;}
function spawnFood(){fall.push({col:pickCol(),e:foodE(),sx:W-22+(Math.random()-.5)*14,jx:(Math.random()-.5)*8,x:W-22,y:-20,vy:60+Math.random()*60,rot:Math.random()*6,vr:(Math.random()-.5)*6});}
function placeNow(e){var c=pickCol();pile.push({col:c,e:e,x:colX(c)+(Math.random()-.5)*6,y:landY(c),r:(Math.random()-.5)*.8});lcnt[c]++;}
function initPile(){pile=[];lcnt=[0,0,0,0,0,0];fall=[];for(var i=0;i<Math.min(S.food,CAP);i++)placeNow(foodE());}
function onEarn(d){var n=clamp(1+Math.floor(Math.log10(d+1)/1.2),1,5);S.food=Math.min(99,S.food+n);dropQ+=n;}
function eatOne(){if(S.food<=0)return false;S.food--;S.hunger=Math.min(100,S.hunger+20);
 var mx=0,mc=-1,i;for(i=0;i<COLS;i++)if(lcnt[i]>mx){mx=lcnt[i];mc=i;}
 if(mc>=0){for(var j=pile.length-1;j>=0;j--)if(pile[j].col===mc){parts.push({x:pile[j].x,y:pile[j].y,vx:(pet.x-pile[j].x)*.8,vy:-80,life:.7,c:pile[j].e});pile.splice(j,1);break;}lcnt[mc]--;}
 if(S.food>pile.length&&pile.length<CAP)placeNow(foodE());
 parts.push({x:pet.x,y:pet.y-CELL*S.size*.8,vx:0,vy:-40,life:1,c:'❤'});chime([440,660]);return true;}
function die(){if(dead)return;dead={t:Date.now()};S.xp=0;cur=1;S.deaths++;S.hunger=0;feeding=false;pet.pose='sit';pet.i=tf;pet.u=Math.max(0,segs[tf].len*.5);save();}
function revive(){dead=null;S.hunger=60;starve=0;pet.pose='sit';pet.until=0;bubble={t:Date.now(),txt:'Reborn at level 1!'};burst(12);chime([392,523,659]);save();}
setInterval(function(){var n=Date.now(),dt=Math.min(5,(n-lastTick)/1000);lastTick=n;
 if(dead){if(n-dead.t>14000)revive();return;}
 if(S.hungry){S.hunger=Math.max(0,S.hunger-dt/12);if(S.hunger<=0){starve+=dt;if(starve>=60)die();}else starve=0;
  if(S.hunger<=75&&S.food>0)feeding=true;
  if(S.hunger<30&&S.food===0&&n>nextHungry){bubble={t:n,txt:S.hunger<=0?'Starving! I need food!':"I'm hungry! Earn some money"};nextHungry=n+40000;}}},1000);
function stopUf(){return Math.max(0,segs[tf].len-(PIL+CELL*S.size*.4));}
function seekInfo(){var f=segs[tf];if(!f)return null;var su=stopUf(),n=segs.length,i=pet.i,u=pet.u,k,j;
 if(i===tf){if(u<su-4)return{d:1};if(u>su+4)return{d:-1};return{arrived:true};}
 var fw=segs[i].len-u,okf=true;
 for(k=1;k<n;k++){j=(i+k)%n;if(j===tf){fw+=su;break;}fw+=segs[j].len;if(segs[j].req>cur)okf=false;}
 var bw=u,okb=true;
 for(k=1;k<n;k++){j=(i-k+n)%n;if(j===tf){bw+=segs[j].len-su;break;}bw+=segs[j].len;if(segs[j].req>cur)okb=false;}
 if(okf&&(!okb||fw<=bw))return{d:1};if(okb)return{d:-1};return null;}
function trailTier(){if(S.trail==='off'||cur<2)return 0;var hi=Math.min(cur,10);if(S.trail==='auto')return hi;var t=+S.trail;return cur>=t?t:hi;}

// ---- behaviour ----
function onBottom(){var s=segs[pet.i];return s.dy===0&&s.a[1]>=H-1;}
function think(now){var idle=(now-lastMove)/1000;
 if(!S.roam){pet.pose='sit';return;}
 if(idle>90&&onBottom()){pet.pose='sleep';pet.until=now+3000;return;}
 var r=Math.random();
 if(idle>25&&r<.45)pet.pose='sit';else if(r<.12)pet.pose='sit';else{pet.pose='walk';if(Math.random()<.3)pet.d*=-1;}
 pet.until=now+(pet.pose==='walk'?4000+Math.random()*7000:2500+Math.random()*4000);}
function step(dt,now){
 var seekNow=false;
 if(dead)pet.pose='sit';
 else{
  if(now>pet.until)think(now);
  if(feeding&&(S.hunger>=100||S.food<=0))feeding=false;
  if(feeding){var sk=seekInfo();if(sk){seekNow=true;pet.until=now+400;if(sk.arrived){pet.pose='eat';pet.d=1;eatT-=dt;if(eatT<=0){eatT=1.3;eatOne();}}else{pet.pose='walk';pet.d=sk.d;}}}
  else if((now-lastMove)/1000>90&&!onBottom()){var sk2=seekInfo();if(sk2&&!sk2.arrived){seekNow=true;pet.until=now+400;pet.pose='walk';pet.d=sk2.d;}else if(sk2)pet.until=0;}}
 var moving=pet.pose==='walk';var idle=(now-lastMove)/1000;
 var sp=moving?(seekNow?95:clamp(38+speed*5,38,150)):0;
 if(moving){var s=segs[pet.i],mv=sp*dt*pet.d;pet.u+=mv;pet.phase+=Math.abs(mv)/(Math.abs(segs[pet.i].dy)>.5?7:10);trAcc+=Math.abs(mv);
  for(var guard=0;guard<4;guard++){s=segs[pet.i];
   if(pet.d>0&&pet.u>=s.len){var nx=(pet.i+1)%segs.length;if(segs[nx].req>cur||(!seekNow&&Math.random()<.18)){pet.d=-1;pet.u=s.len;}else{pet.u-=s.len;pet.i=nx;}}
   else if(pet.d<0&&pet.u<=0){var pv=(pet.i-1+segs.length)%segs.length;if(segs[pv].req>cur||(!seekNow&&Math.random()<.18)){pet.d=1;pet.u=0;}else{pet.i=pv;pet.u=segs[pv].len+pet.u;}}
   else break;}}
 var seg=segs[pet.i];pet.x=seg.a[0]+seg.dx*pet.u;pet.y=seg.a[1]+seg.dy*pet.u;
 if(moving&&!dead&&trAcc>=11){trAcc=0;var tt=trailTier();if(tt){var tsz=CELL*S.size,wl=Math.abs(seg.dy)>.5,ex=pet.x-seg.dx*pet.d*tsz*.22+(wl?-(seg.dy<0?1:-1)*tsz*.2:0),ey=pet.y-seg.dy*pet.d*tsz*.22+(wl?0:(seg.dx>0?-4:5));trail.push({x:ex,y:ey,life:1.8,k:trPos++,t:tt});if(trail.length>160)trail.shift();}}
 trail.forEach(function(q){q.life-=dt;});trail=trail.filter(function(q){return q.life>0;});
 dropT-=dt;if(dropQ>0&&dropT<=0){dropQ--;dropT=.14;spawnFood();}
 fall.forEach(function(f){f.vy+=720*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;var ty=landY(f.col),p=clamp((f.y+20)/(ty+20),0,1);f.x=f.sx+((colX(f.col)+f.jx)-f.sx)*p;if(f.y>=ty){f.done=true;if(pile.length<CAP){pile.push({col:f.col,e:f.e,x:f.x,y:ty,r:(f.rot%.8)-.4});lcnt[f.col]++;}else parts.push({x:f.x,y:ty,vx:0,vy:-30,life:.6,c:'✨'});}});
 fall=fall.filter(function(f){return !f.done;});
 var ta=Math.atan2(seg.dy,seg.dx),da=((ta-pet.ang+Math.PI*3)%(Math.PI*2))-Math.PI;pet.ang+=da*Math.min(1,dt*9);
 pet.face=pet.d;pet.sit+=(((pet.pose==='sit'||pet.pose==='sleep')?1:0)-pet.sit)*Math.min(1,dt*6);
 if(jump>0){jump=Math.max(0,jump-dt*1.6);}
 parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;p.life-=dt;});parts=parts.filter(function(p){return p.life>0;});}
function drawTrail(){var sz=CELL*S.size,s=Math.max(5,sz*.1),sp=S.species;trail.forEach(function(q){var a=clamp(q.life/1.8,0,1);g.globalAlpha=a*.9;var col=q.t>=10?'hsl('+((q.k*28)%360)+',95%,60%)':TCOL[q.t-2];g.fillStyle=col;g.strokeStyle=col;g.save();g.translate(q.x,q.y);
 if(sp==='dog'||sp==='cat'){g.translate(0,(q.k%2?1:-1)*s*.3);g.beginPath();g.arc(0,0,s*.55,0,6.3);g.fill();[[-.7,-.75],[0,-1],[.7,-.75]].forEach(function(o){g.beginPath();g.arc(o[0]*s*.55,o[1]*s*.55-s*.2,s*.22,0,6.3);g.fill();});}
 else if(sp==='panda'){g.rotate(q.k%2?.7:-.7);g.beginPath();g.ellipse(0,0,s*.35,s*.8,0,0,6.3);g.fill();}
 else if(sp==='penguin'){g.lineWidth=Math.max(1.5,s*.18);for(var z=0;z<3;z++){g.rotate(Math.PI/3);g.beginPath();g.moveTo(-s*.7,0);g.lineTo(s*.7,0);g.stroke();}}
 else{g.lineWidth=Math.max(1.5,s*.2);g.beginPath();g.arc(0,0,s*.55*(1.3-a*.3),0,6.3);g.stroke();}
 g.restore();});g.globalAlpha=1;}
